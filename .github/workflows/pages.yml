# main에 올리면 GitHub Pages 사이트(https://www.spacozy.co.kr)를 자동으로 다시 만듭니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          # 정식 도메인(www.spacozy.co.kr)에 연결되어 있으므로 경로 앞에 /spacozy 를 붙이지 않음
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://www.spacozy.co.kr
          # 검색 차단: "1" = 차단(noindex·robots Disallow), "0" = 허용
          NEXT_PUBLIC_PREVIEW: "0"
      # GitHub Pages 정식 도메인 — 이 파일이 있어야 배포할 때마다 도메인 연결이 유지됩니다
      - run: touch out/.nojekyll && echo "www.spacozy.co.kr" > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
